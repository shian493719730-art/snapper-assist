name: Source and documentation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check_source.py
      - run: python3 scripts/test_preferences.py
      - run: python3 scripts/test_source_index.py
      - run: python3 scripts/test_package_methods.py
