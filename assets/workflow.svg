<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 240" role="img" aria-labelledby="title desc"><title id="title">Select. Refine. Keep working.</title><desc id="desc">Workflow diagram, not an app screenshot: select text in your app, generate and review a suggestion, then replace or undo.</desc><rect width="1050" height="240" rx="22" fill="#f5f2ed"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#2e424f"><text x="34" y="39" font-size="12" letter-spacing="2">SNAPPER ASSIST · WORKFLOW</text><g fill="#fffdfa" stroke="#ded9d1"><rect x="30" y="64" width="300" height="130" rx="16"/><rect x="375" y="64" width="300" height="130" rx="16"/><rect x="720" y="64" width="300" height="130" rx="16"/></g><g font-size="14" fill="#de613d"><text x="50" y="94">01</text><text x="395" y="94">02</text><text x="740" y="94">03</text></g><g font-size="22" font-weight="600"><text x="50" y="127">Select your text</text><text x="395" y="127">Refine &amp; review</text><text x="740" y="127">Replace or undo</text></g><g font-size="14" fill="#63717a"><text x="50" y="158">Stay in the app you're using.</text><text x="395" y="158">AI on click. Local fallback.</text><text x="740" y="158">You decide what gets written.</text></g><g fill="none" stroke="#8a958e" stroke-width="2"><path d="M341 129H362m-7-7 7 7-7 7"/><path d="M686 129H707m-7-7 7 7-7 7"/></g><text x="34" y="221" font-size="11" fill="#78827f">Workflow illustration · Actual behavior and beta limits are documented below.</text></g></svg>
